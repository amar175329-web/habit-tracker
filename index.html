<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F6F5" />
    <meta name="description" content="Habbitrack — Build consistent habits and rhythm, completely private and local-first." />
    <title>Habbitrack — Build Consistent Rhythms</title>
    <script>
      (function() {
        try {
          // Immediately unregister all ServiceWorkers and wipe stale CacheStorage
          if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          if (typeof window !== 'undefined' && 'caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }

          var PURGE_KEY = 'habittracker_clean_restart_v12';
          if (!localStorage.getItem(PURGE_KEY)) {
            var theme = localStorage.getItem('theme') || localStorage.getItem('dailyos_theme');
            localStorage.clear();
            if (theme) {
              localStorage.setItem('theme', theme);
              localStorage.setItem('dailyos_theme', theme);
            }
            sessionStorage.clear();
            if (window.indexedDB && indexedDB.deleteDatabase) {
              indexedDB.deleteDatabase('dailyos_db');
            }
          }

          var savedTheme = localStorage.getItem('dailyos_theme') || localStorage.getItem('theme');
          var isDark = savedTheme === 'dark';
          var activeTheme = isDark ? 'dark' : 'light';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0B1112');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F2F6F5');
          }

          function syncAndroidTheme() {
            var dark = document.documentElement.classList.contains('dark') ||
                       document.documentElement.getAttribute('data-theme') === 'dark' ||
                       localStorage.getItem('dailyos_theme') === 'dark';
            var t = dark ? 'dark' : 'light';
            if (window.AndroidTheme && window.AndroidTheme.setTheme) {
              window.AndroidTheme.setTheme(t);
            }
            try {
              if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppTheme) {
                window.Capacitor.Plugins.AppTheme.setTheme({ theme: t });
              }
            } catch (e) {}
          }
          syncAndroidTheme();
          window.addEventListener('DOMContentLoaded', syncAndroidTheme);
          window.addEventListener('load', syncAndroidTheme);
          window.addEventListener('storage', syncAndroidTheme);

          // Watch for theme mutations on root HTML element
          if (window.MutationObserver) {
            var themeObserver = new MutationObserver(function() {
              syncAndroidTheme();
            });
            themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });
          }

          // Completely suppress native contextmenu & selection action bar popups across app
          document.addEventListener('contextmenu', function(e) {
            var target = e.target;
            if (!target || !target.closest('input, textarea, [contenteditable="true"]')) {
              e.preventDefault();
            }
          }, { passive: false });

          document.addEventListener('selectionchange', function() {
            var active = document.activeElement;
            var isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
            if (!isInput) {
              var sel = window.getSelection();
              if (sel && sel.removeAllRanges) {
                sel.removeAllRanges();
              }
            }
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
