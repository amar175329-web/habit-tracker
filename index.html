<!doctype html>
<html lang="en" class="light" data-theme="light" style="background-color: #F2F6F5; color: #0E1F1E;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F6F5" />
    <meta name="description" content="Habbitrack — Build consistent habits and rhythm, completely private and local-first." />
    <title>Habbitrack — Build Consistent Rhythms</title>
    <style id="splash-critical-css">
      html, body, #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #F2F6F5;
        color: #0E1F1E;
      }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = null;
          try {
            if (window.AndroidTheme && typeof window.AndroidTheme.getTheme === 'function') {
              savedTheme = window.AndroidTheme.getTheme();
            }
          } catch (e) {}
          try {
            if (savedTheme !== 'dark' && savedTheme !== 'light') {
              var localSaved = localStorage.getItem('dailyos_theme') || localStorage.getItem('theme');
              if (localSaved === 'dark') {
                savedTheme = 'dark';
              } else if (localSaved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                savedTheme = 'dark';
              } else if (localSaved === 'light') {
                savedTheme = 'light';
              }
            }
          } catch (e) {}
          savedTheme = (savedTheme === 'dark') ? 'dark' : 'light';
          try {
            localStorage.setItem('dailyos_theme', savedTheme);
            localStorage.setItem('theme', savedTheme);
          } catch (e) {}

          // Synchronize with native Android splash and status bar on JS load
          try {
            if (window.AndroidTheme && typeof window.AndroidTheme.setTheme === 'function') {
              window.AndroidTheme.setTheme(savedTheme);
            }
          } catch (e) {}

          var isDark = savedTheme === 'dark';
          var bg = isDark ? '#0B1112' : '#F2F6F5';
          var text = isDark ? '#EAF4F2' : '#0E1F1E';

          document.documentElement.className = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = text;

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bg);

          var s = document.getElementById('splash-critical-css');
          if (s) {
            s.innerHTML = 'html, body, #root { width: 100%; min-height: 100%; margin: 0; padding: 0; background-color: ' + bg + ' !important; color: ' + text + ' !important; }';
          }

          function notifyAppReady() {
            try {
              if (window.AndroidTheme && window.AndroidTheme.onAppReady) {
                window.AndroidTheme.onAppReady();
              }
              if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppTheme && window.Capacitor.Plugins.AppTheme.onAppReady) {
                window.Capacitor.Plugins.AppTheme.onAppReady();
              }
            } catch(e) {}
          }
          window.notifyAppReady = notifyAppReady;

          // Suppress native contextmenu & selection action bar popups across app
          document.addEventListener('contextmenu', function(e) {
            var target = e.target;
            if (!target || !target.closest('input, textarea, [contenteditable="true"]')) {
              e.preventDefault();
            }
          }, { passive: false });

          document.addEventListener('selectionchange', function() {
            var active = document.activeElement;
            var isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
            if (!isInput) {
              var sel = window.getSelection();
              if (sel && sel.removeAllRanges) {
                sel.removeAllRanges();
              }
            }
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: inherit; color: inherit; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
