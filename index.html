<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F6F5" />
    <meta name="description" content="Habit Tracker — Build consistent habits and rhythm, completely private and local-first." />
    <title>Habit Tracker — Build Consistent Rhythms</title>
    <script>
      (function() {
        try {
          var PURGE_KEY = 'habittracker_clean_restart_v12';
          if (!localStorage.getItem(PURGE_KEY)) {
            var theme = localStorage.getItem('theme') || localStorage.getItem('dailyos_theme');
            localStorage.clear();
            if (theme) {
              localStorage.setItem('theme', theme);
              localStorage.setItem('dailyos_theme', theme);
            }
            sessionStorage.clear();
            if (window.indexedDB && indexedDB.deleteDatabase) {
              indexedDB.deleteDatabase('dailyos_db');
            }
          }

          var savedTheme = localStorage.getItem('dailyos_theme') || localStorage.getItem('theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0B1112');
            if (window.AndroidTheme && window.AndroidTheme.setTheme) {
              window.AndroidTheme.setTheme('dark');
            }
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F2F6F5');
            if (window.AndroidTheme && window.AndroidTheme.setTheme) {
              window.AndroidTheme.setTheme('light');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
