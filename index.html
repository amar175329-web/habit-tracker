<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F6F5" />
    <meta name="description" content="Habit Tracker — Build consistent habits and rhythm, completely private and local-first." />
    <title>Habit Tracker — Build Consistent Rhythms</title>
    <script>
      (function() {
        try {
          var PURGE_KEY = 'habittracker_clean_restart_v12';
          if (!localStorage.getItem(PURGE_KEY)) {
            var theme = localStorage.getItem('theme');
            localStorage.clear();
            if (theme) localStorage.setItem('theme', theme);
            sessionStorage.clear();
            if (window.indexedDB && indexedDB.deleteDatabase) {
              indexedDB.deleteDatabase('dailyos_db');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
