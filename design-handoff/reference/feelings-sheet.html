<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>feelings-sheet</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
<script>if(location.search.includes('dark'))document.documentElement.classList.add('dark')</script>
</head>
<body style="margin:0;display:flex;justify-content:center;background:#888">


<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',sans-serif"><div style="position:absolute;inset:0;background:rgba(10,20,20,.4)"></div><div style="position:absolute;left:0;right:0;bottom:0;top:150px;background:var(--card);border-radius:32px 32px 0 0;padding:14px 18px 24px"><div style="width:42px;height:5px;border-radius:3px;background:var(--tr);margin:0 auto 14px"></div><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:800;font-size:19px">How are you feeling?</div><span style="font-weight:800;color:var(--prt);font-size:14px">Done</span></div><div style="height:50px;border-radius:25px;background:var(--bg);border:1.5px solid var(--pr);display:flex;align-items:center;padding:0 18px;margin-top:16px;font-size:15px;font-weight:600">thaka<span style="display:inline-block;width:2px;height:20px;background:var(--pr);margin-left:2px"></span></div><div style="display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--tint);border-radius:18px;padding:12px 14px"><span style="font-weight:800;font-size:15px;color:var(--prt)">Tired</span><span style="flex:1;font-size:12.5px;font-weight:600;color:var(--mu)">matched from “thaka”</span><span style="font-size:12.5px;font-weight:800;color:var(--on);background:var(--pr);padding:7px 14px;border-radius:99px">Add</span></div><div style="margin:22px 2px 10px;font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--mu)">QUICK PICKS</div><div style="display:flex;flex-wrap:wrap;gap:8px"><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Happy</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Calm</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Focused</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--tint);color:var(--prt);border:1px solid var(--pr)">Grateful</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--tint);color:var(--prt);border:1px solid var(--pr)">Tired</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Stressed</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Anxious</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Sad</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Angry</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Bored</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Excited</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--bg);color:var(--mu)">Okay</span></div><div style="margin:22px 2px 10px;font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--mu)">TODAY YOU FELT</div><div style="display:flex;flex-wrap:wrap;gap:8px"><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--tint);color:var(--prt);border:1px solid var(--pr)">Grateful</span><span style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:99px;background:var(--tint);color:var(--prt);border:1px solid var(--pr)">Tired</span></div><div style="font-size:12.5px;font-weight:600;color:var(--mu);margin-top:20px;line-height:1.5">Type any feeling, in any language. It is matched for you; nothing to scroll through.</div></div></div>

</body>
</html>
